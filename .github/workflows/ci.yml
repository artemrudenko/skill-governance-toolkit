# This is the TOOLKIT'S OWN self-CI — it audits the whole tree and runs the full
# test/behavior suite on every push/PR to this repo. It is NOT the template a
# consuming marketplace repo should copy. Consumers want the changed-only PR gate:
#   GitHub: references/ci/github-pr.yml   GitLab: references/ci/gitlab-ci.yml
#
# Action pinning: the third-party `actions/*` below use floating major tags
# (@v7), NOT 40-char SHAs — a deliberate, accepted residual risk. The
# immutable-SHA rule the toolkit enforces targets SGT_REF (the gate-logic source
# an attacker could re-tag to change verdicts); these are first-party
# GitHub-owned helper actions whose compromise implies GitHub itself is breached.
# Bump to SHA pins here if your threat model requires it.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  audit:
    name: Self-audit and behavior tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run toolkit self-audit
        run: bash scripts/audit.sh

      - name: Run agent governance behavior tests
        run: python3 scripts/test_agent_audit.py

      - name: Run release-ready audit engine gate
        run: python3 scripts/agent_audit.py audit-project . --profile release-ready --fail-on any --format json

  windows-parity:
    name: install.ps1 behavioral parity (pwsh)
    # Ubuntu ships pwsh. Tests exercise Unix delegation and force the native
    # branch in an isolated fixture. The Windows job below checks the real OS.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Confirm pwsh is available
        run: pwsh -version

      - name: install.ps1 syntax + behavioral install tests
        run: python3 scripts/test_install.py

  windows-native:
    name: PowerShell install on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check native installer for one skill and all hosts
        run: >-
          python scripts/test_install.py
          InstallBehaviorTests.test_powershell_native_branch_single_skill
          InstallBehaviorTests.test_powershell_native_branch_all_hosts_single_skill

  docker:
    name: Docker MCP smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t agent-governance-mcp:ci .

      - name: Smoke test MCP tools/list
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | docker run --rm -i --network none -v "$PWD:/workspace:ro" agent-governance-mcp:ci

      - name: Smoke test Docker audit_project
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"audit_project","arguments":{"root":"/workspace","profile":"release-ready"}}}' \
            | docker run --rm -i --network none -v "$PWD:/workspace:ro" agent-governance-mcp:ci
