# Skill governance gate for an AI Tools Marketplace repository (GitLab CI).
#
# Copy this file to the ROOT of the marketplace repo as `.gitlab-ci.yml`
# (or `include:` it from an existing pipeline).
#
# It runs the toolkit's deterministic audit engine (stdlib-only Python, no pip)
# against ONLY the skills/agents changed in a merge request. Tiered gate:
#   - block job    : fails the pipeline on NEWLY introduced high findings -> blocks merge
#   - advisory job : never fails, publishes findings as a JSON artifact
#
# Why `--changed-only`: an author is accountable for the entities their MR
# touches, not for legacy assets already in the marketplace.
#
# Why `--fail-on-new high` (not `--fail-on high`): the gate blocks only on
# high-severity findings the MR INTRODUCES versus the base commit. A
# pre-existing high finding in a file the MR happens to touch will not block —
# so adoption never stalls on legacy debt the author did not create.
#
# Kill-switch: set the org/project CI/CD variable SGT_FAIL_MODE=advisory to
# downgrade the gate to non-blocking fleet-wide WITHOUT editing this pinned
# template. The engine honors it automatically (exit 0 even on a blocking
# finding). It is a CI/CD variable, so it is already in the job environment.

stages:
  - validate

# Always-green placeholder so every MR has a pipeline. The gate jobs below run
# only when an MR touches a governed asset (see `.sgt_base` rules:changes). With
# "Pipelines must succeed" enabled in GitLab, an MR that touches no governed
# asset would otherwise produce no pipeline at all — and the merge blocks forever
# waiting for a pipeline that never runs. This job is gated only on
# merge_request_event (no `changes:` filter), so it always runs and always passes.
noop:
  image: $SGT_NOOP_IMAGE
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "Pipeline present for this MR."

variables:
  # Full history so the merge-request base commit is reachable for the diff.
  GIT_DEPTH: "0"
  # Toolkit source. Pin SGT_REF to an IMMUTABLE commit SHA (not a tag) so a
  # re-tagged release cannot silently change gate behaviour. Replace with the
  # 40-char SHA of the toolkit commit your org has reviewed and approved.
  #
  # Clone auth: the default URL embeds the per-job CI_JOB_TOKEN, which GitLab
  # injects automatically — no PAT needed. For a private toolkit mirror you must
  # ALSO allow this consumer project on the toolkit project's job-token allowlist:
  #   toolkit project → Settings → CI/CD → Token Access →
  #   "Limit access TO this project" → add the marketplace repo(s).
  # (On a public/internal-visibility mirror the token is simply ignored.)
  SGT_REPO: "https://gitlab-ci-token:${CI_JOB_TOKEN}@REPLACE-WITH-YOUR-GITLAB-HOST/your-group/skill-governance-toolkit.git"
  SGT_REF: "REPLACE-WITH-40-CHAR-COMMIT-SHA"
  SGT_DIR: "/tmp/sgt"
  # Job images — digest-pinned by default, same «the gate cannot change
  # silently» discipline as SGT_REF (a floating tag like python:3.12-slim can
  # be repushed upstream and alter gate behaviour with no diff here).
  # Bump procedure (deliberate, after review):
  #   1. Resolve the new manifest-list digest:
  #        docker buildx imagetools inspect python:3.12-slim
  #      (or query the registry API for Docker-Content-Digest)
  #   2. Replace the digest below and commit — the MR diff IS the review trail.
  # Trade-off: a pinned digest does not receive upstream CVE patches; schedule
  # periodic bumps. On an air-gapped or egress-restricted GitLab instance,
  # override these as group/project CI/CD variables to point at your internal
  # registry mirror, e.g.
  #   SGT_IMAGE: registry.example.com/mirrors/python:3.12-slim@sha256:<digest>
  # SGT_IMAGE needs python3 + git (if git is missing the job apt-installs it,
  # which requires Debian repo access — a mirrored image with git avoids that).
  # Digests resolved 2026-06-10 (python:3.12-slim / alpine:3.20 manifest lists).
  SGT_IMAGE: "python:3.12-slim@sha256:090ba77e2958f6af52a5341f788b50b032dd4ca28377d2893dcf1ecbdfdfe203"
  SGT_NOOP_IMAGE: "alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc"

# Shared setup: only run on merge requests that touch governed entities.
.sgt_base:
  image: $SGT_IMAGE
  before_script:
    # Skipped entirely when the image already ships git (e.g. an internal
    # mirror image) — keeps the gate self-contained on egress-restricted runners.
    - command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null)
    # Fetch then checkout the pinned SHA, and verify HEAD matches it.
    - git clone "$SGT_REPO" "$SGT_DIR"
    - git -C "$SGT_DIR" checkout -q "$SGT_REF"
    - test "$(git -C "$SGT_DIR" rev-parse HEAD)" = "$SGT_REF" || (echo "Toolkit SHA mismatch" && exit 1)
  rules:
    # Keep this list in sync with the engine's governed asset types
    # (agent_audit.py asset_type). A path the engine governs but CI ignores
    # is a silent coverage gap.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "skills/**/*"
        - ".github/skills/**/*"
        - ".agents/skills/**/*"
        - "agents/**/*"
        - "commands/**/*"
        - "prompts/**/*"
        - "AGENTS.md"
        - "CLAUDE.md"
        - "GEMINI.md"
        - ".github/copilot-instructions.md"
        - "gemini-extension.json"
        - "**/.mcp.json"
        - "**/mcp.json"
        - "**/plugin.json"
        - ".claude/settings.json"
        - ".claude/settings.local.json"
        - "hooks/**"
        - "references/agent-audit-rules.json"
        # Suppression control-plane: a suppression-only MR must still get a gate
        # verdict (otherwise it silently weakens the gate ungated).
        - "references/audit-ignore.json"
        # Config overlays load from the PINNED TOOLKIT MIRROR, not the audited
        # repo — a consumer-side audit-config.*.json is IGNORED by the engine.
        # Triggered here only so the "config overlay is ignored" warning fires.
        - "references/audit-config.*.json"

# Blocking gate: NEWLY introduced high-severity findings (secrets, dangerous
# shell, broken frontmatter, allowed-tools) fail the pipeline and block the
# merge. Pre-existing high findings on touched legacy assets do not block.
#
# SGT_FAIL_MODE (CI/CD variable) is inherited from the job environment; set it
# to "advisory" org-wide to downgrade this gate to non-blocking.
skill-gate:block:
  extends: .sgt_base
  stage: validate
  script:
    # Suppression hygiene — block on already-EXPIRED suppressions on every governed
    # MR: an expired entry means the floor finding it silenced has resurfaced and the
    # gate is OFF for that rule/path now; any merge inherits the hole. No
    # --expiring-within, so a merely soon-to-expire entry never blocks an unrelated
    # MR. `.` is the audited consumer root, where audit-ignore.json lives (loaded via
    # _load_ignore_doc, not $SGT_DIR — the mirror holds only the catalog + overlays).
    - >
      python3 "$SGT_DIR/scripts/agent_audit.py" list-suppressions --root .
    # Expiring-soon early-warning (within 30 days) blocks ONLY when THIS MR edits the
    # suppression file — the author touching suppressions is the right owner to renew
    # or remove them. The fleet is never blocked on a third party's soon-to-expire
    # entry. For a proactive fleet-wide sweep, run this same command on a scheduled
    # pipeline ($CI_PIPELINE_SOURCE == "schedule").
    - >
      if git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD | grep -qx "references/audit-ignore.json"; then
      python3 "$SGT_DIR/scripts/agent_audit.py" list-suppressions --root . --expiring-within 30;
      fi
    # Config-overlay warning: a consumer-side audit-config.*.json is IGNORED (overlays
    # load from the pinned mirror, $SGT_DIR). Warn loudly but never block — the file
    # is inert, the real verdict is the audit-project step below.
    - >
      changed=$(git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD | grep -E '^references/audit-config\..*\.json$' || true);
      if [ -n "$changed" ]; then
      echo "WARNING: consumer-side audit-config overlay is IGNORED by the engine — overlays must live in the pinned toolkit mirror (SGT_REF), not the audited repo:";
      echo "$changed";
      fi
    - >
      python3 "$SGT_DIR/scripts/agent_audit.py" audit-project .
      --changed-only --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      --profile release-ready --fail-on-new high --format text

# Advisory: every finding (medium/low/info included) as a JSON artifact, and
# an idempotent MR comment. Never blocks the pipeline.
#
# Set a masked CI/CD variable GITLAB_TOKEN (a project/group access token with
# `api` scope) to enable the comment. Without it the poster is skipped.
skill-gate:advisory:
  extends: .sgt_base
  stage: validate
  allow_failure: true
  script:
    - >
      python3 "$SGT_DIR/scripts/agent_audit.py" audit-project .
      --changed-only --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      --profile release-ready --fail-on none --format json
      | tee skill-audit.json
    - >
      if [ -n "$GITLAB_TOKEN" ]; then
        python3 "$SGT_DIR/scripts/post_mr_comment.py" skill-audit.json;
      else
        echo "GITLAB_TOKEN not set — skipping MR comment.";
      fi
  artifacts:
    when: always
    paths:
      - skill-audit.json
    expire_in: 1 week
